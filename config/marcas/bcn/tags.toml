# Tags da BCN: vocabulário controlado para o import, os cortes e a busca.
# Tags livres podem ser criadas no painel; as que se repetem podem ser promovidas para cá.
# Cada categoria: nome, se aceita várias tags por mídia, e a lista (slug = "Nome visível").

[categorias.pessoa]
nome = "Pessoa"
multipla = true
tags = {}                      # ex.: { "fulano" = "Fulano da Silva" }

[categorias.lugar]
nome = "Lugar"
multipla = true
tags = { "barcelona" = "Barcelona", "camp-nou" = "Camp Nou", "la-masia" = "La Masia", "lloret" = "Lloret de Mar", "girona" = "Girona", "tibidabo" = "Tibidabo", "madrid" = "Madrid" }

[categorias.evento]
nome = "Evento"
multipla = true
tags = { "copa-micfootball" = "Copa Micfootball", "copa-girona" = "Copa Girona", "desafio-barcelona" = "Desafio Barcelona", "bcn-cup" = "BCN Cup", "ibero-americano" = "Ibero Americano", "nike-3x3" = "Nike 3x3", "copa-diadora" = "Copa Diadora" }

[categorias.momento]
nome = "Momento"
multipla = true
tags = { "chegada" = "Chegada", "treino" = "Treino", "jogo" = "Jogo", "bastidor" = "Bastidor", "depoimento" = "Depoimento", "torcida-pais" = "Pais e torcida", "turismo" = "Turismo", "premiacao" = "Premiação" }

[categorias.plano]
nome = "Plano"
multipla = false
tags = { "aberto" = "Aberto", "medio" = "Médio", "fechado" = "Fechado", "detalhe" = "Detalhe", "drone" = "Drone" }

[categorias.qualidade]
nome = "Qualidade"
multipla = false
tags = { "otima" = "Ótima", "usavel" = "Usável", "ruim" = "Ruim" }

# Frases que a IA de imagem compara com cada tag (src/acervo/reconhecer.py). Sem frase, usa
# "uma foto de <nome>". Só as categorias de reconhecimento.categorias entram.
[ia.lugar]
camp-nou = "o estádio Camp Nou do Barcelona"
la-masia = "um centro de treinamento de futebol com vários campos de grama"
tibidabo = "a montanha do Tibidabo com o parque de diversões e a igreja"
barcelona = "as ruas e prédios da cidade de Barcelona"
lloret = "uma praia com areia e mar em Lloret de Mar"
girona = "o centro histórico da cidade de Girona"
madrid = "a cidade de Madrid"

[ia.momento]
chegada = "um grupo de jovens chegando no aeroporto com malas"
treino = "um treino de futebol com cones e exercícios"
jogo = "uma partida de futebol com dois times em campo"
bastidor = "bastidores do time no vestiário, no ônibus ou no hotel"
depoimento = "uma pessoa falando para a câmera em primeiro plano"
torcida-pais = "pais e torcida assistindo na arquibancada"
turismo = "jovens passeando como turistas num ponto turístico"
premiacao = "uma cerimônia de premiação com troféu e medalhas"

[ia.plano]
aberto = "uma imagem aberta que mostra o lugar inteiro de longe"
medio = "pessoas enquadradas da cintura para cima"
